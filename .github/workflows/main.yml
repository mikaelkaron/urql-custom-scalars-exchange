name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every major version listed in the `graphql` peer dependency range.
        graphql: ['15', '16', '17']

    name: graphql@${{ matrix.graphql }}

    steps:
      - name: Begin CI...
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          CI: true

      - name: Pin graphql to ${{ matrix.graphql }}
        if: matrix.graphql != '17'
        run: yarn up graphql@^${{ matrix.graphql }}
        env:
          CI: true

      - name: Lint
        run: yarn lint
        env:
          CI: true

      - name: Test
        run: yarn test --ci --coverage --maxWorkers=2
        env:
          CI: true

      - name: Build
        run: yarn build
        env:
          CI: true
